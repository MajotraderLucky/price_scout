[package]
name = "price-scout-scraper"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "price-scout-worker"
path = "src/bin/worker.rs"

[[bin]]
name = "price-scout-scheduler"
path = "src/bin/scheduler.rs"

[dependencies]
price-scout-models = { path = "../models" }
price-scout-db = { path = "../db" }

tokio = { workspace = true, features = ["process", "io-util", "time", "signal"] }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
sqlx = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
dotenv = { workspace = true }
